name: Publish portfolio framework
on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand reviewed portfolio source
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/portfolio.tar.gz
          tar -xzf /tmp/portfolio.tar.gz
      - name: Commit portfolio framework
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build portfolio-ready Playwright framework'
          git push
